name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mcp-use requires ^20.19.0 || >=22.12.0, so Node 18 cannot install this
        # tree even though package.json still declares engines.node >= 18.
        # 20 is what the Dockerfile ships (node:20-slim).
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` compiles to dist/ first, so this covers the build as well as
      # the HTTP routing and discovery suites.
      - name: Build and test
        run: npm test
        env:
          MCP_USE_ANONYMIZED_TELEMETRY: 'false'

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches node:20-slim in the Dockerfile.
          node-version: '20'
          cache: npm

      # The image build has its own npm ci + tsc, which broke repeatedly in the
      # past without anything catching it before deploy.
      - name: Build image
        run: docker build -t agentphone-mcp:ci .

      - name: Start container
        run: |
          docker run -d --name mcp-smoke -p 3000:3000 \
            -e MCP_USE_ANONYMIZED_TELEMETRY=false \
            agentphone-mcp:ci

      # Building only proves the image compiles. #43 and #44 were routing bugs
      # visible only at runtime, so boot the image and require it to serve.
      - name: Smoke-test the running image
        run: |
          card_url="http://localhost:3000/.well-known/mcp/server-card.json"
          for _ in $(seq 1 60); do
            if curl -fsS "$card_url" -o card.json; then
              break
            fi
            if [ -z "$(docker ps -q -f name=mcp-smoke)" ]; then
              echo "::error::Container exited before serving traffic"
              exit 1
            fi
            sleep 1
          done

          if [ ! -s card.json ]; then
            echo "::error::Server card never became reachable"
            exit 1
          fi
          cat card.json

          name="$(node -p "require('./card.json').serverInfo.name")"
          endpoint="$(node -p "require('./card.json').transport.endpoint")"
          if [ "$name" != "agentphone" ] || [ "$endpoint" != "/mcp" ]; then
            echo "::error::Unexpected server card: name=$name endpoint=$endpoint"
            exit 1
          fi

          # #44 was a route that answered only one path form. An unknown path
          # must still reach the app and 404 as JSON, not fall through to an
          # HTML error page.
          read -r status ctype <<<"$(curl -s -o /dev/null \
            -w '%{http_code} %{content_type}' \
            http://localhost:3000/this-route-does-not-exist)"
          if [ "$status" != "404" ]; then
            echo "::error::Unknown route returned $status, expected 404"
            exit 1
          fi
          case "$ctype" in
            text/html*)
              echo "::error::Unknown route served an HTML error page ($ctype)"
              exit 1
              ;;
          esac
          echo "Image booted and served correctly."

      # Freshness is checked by comparing built artifacts, not a version string.
      # The served version comes from a hand-maintained VERSION constant in
      # src/index.ts that does not move on most commits — it stayed 0.7.0
      # through all of #42-#46, including the stale dist/ that shipped in #45 —
      # so it cannot tell a current build from a stale one.
      - name: Verify the image ships the current build
        run: |
          npm ci
          npm run build

          cid="$(docker create agentphone-mcp:ci)"
          docker cp "$cid:/app/dist" ./image-dist
          docker rm "$cid" > /dev/null

          ( cd dist && find . -name '*.js' | sort | xargs sha256sum ) > source-build.sums
          ( cd image-dist && find . -name '*.js' | sort | xargs sha256sum ) > image-build.sums

          if ! diff -u source-build.sums image-build.sums; then
            echo "::error::The image's dist/ does not match a fresh build of src/ — the image is shipping stale or unexpected code."
            exit 1
          fi
          echo "Image dist/ matches a fresh build of the checked-out source."

      - name: Container logs
        if: failure()
        run: docker logs mcp-smoke || true

      - name: Remove container
        if: always()
        run: docker rm -f mcp-smoke || true
