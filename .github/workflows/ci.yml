name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mcp-use requires ^20.19.0 || >=22.12.0, so Node 18 cannot install this
        # tree even though package.json still declares engines.node >= 18.
        # 20 is what the Dockerfile ships (node:20-slim).
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` compiles to dist/ first, so this covers the build as well as
      # the HTTP routing and discovery suites.
      - name: Build and test
        run: npm test
        env:
          MCP_USE_ANONYMIZED_TELEMETRY: 'false'

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image build has its own npm ci + tsc, which broke repeatedly in the
      # past without anything catching it before deploy.
      - name: Build image
        run: docker build -t agentphone-mcp:ci .

      - name: Start container
        run: |
          docker run -d --name mcp-smoke -p 3000:3000 \
            -e MCP_USE_ANONYMIZED_TELEMETRY=false \
            agentphone-mcp:ci

      # Building only proves the image compiles. #45 shipped an image that built
      # fine but carried a stale dist/, so prod served pre-#44 routing — a
      # runtime-only regression. Boot the image and require it to actually serve.
      - name: Smoke-test the running image
        run: |
          card_url="http://localhost:3000/.well-known/mcp/server-card.json"
          for _ in $(seq 1 60); do
            if curl -fsS "$card_url" -o card.json; then
              break
            fi
            if [ -z "$(docker ps -q -f name=mcp-smoke)" ]; then
              echo "::error::Container exited before serving traffic"
              exit 1
            fi
            sleep 1
          done

          if [ ! -s card.json ]; then
            echo "::error::Server card never became reachable"
            exit 1
          fi
          cat card.json

          name="$(node -p "require('./card.json').serverInfo.name")"
          served="$(node -p "require('./card.json').serverInfo.version")"
          expected="$(node -p "require('./package.json').version")"

          if [ "$name" != "agentphone" ]; then
            echo "::error::Unexpected serverInfo.name: $name"
            exit 1
          fi
          # A stale dist/ serves an older version than the source tree declares.
          if [ "$served" != "$expected" ]; then
            echo "::error::Image serves version $served, package.json declares $expected"
            exit 1
          fi
          echo "Image booted and served the MCP server card (v$served)."

      - name: Container logs
        if: failure()
        run: docker logs mcp-smoke || true

      - name: Remove container
        if: always()
        run: docker rm -f mcp-smoke || true
